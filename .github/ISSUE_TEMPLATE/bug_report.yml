name: Bug report
description: The engine or server did something wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request or command
      description: The exact request body or command line (remove any token). Attach media inputs if they are needed to reproduce.
      render: json
    validations:
      required: true
  - type: input
    id: binary
    attributes:
      label: Binary sha256
      description: "`sha256sum liquid-lfm3-server` (or the binary you ran)"
    validations:
      required: true
  - type: input
    id: checkpoint
    attributes:
      label: Checkpoint and revision
      placeholder: LiquidAI/LFM3-Omni-2B @ <revision>
  - type: input
    id: hardware
    attributes:
      label: Hardware and CUDA version
      placeholder: Jetson AGX Thor, JetPack 7, CUDA 13.0
  - type: textarea
    id: output
    attributes:
      label: Output, logs or error
      render: text
